[package]
name = "ipmsg-download"
version.workspace = true
edition.workspace = true
description = "Multi-protocol download engines (Torrent, eDonkey, Xunlei P2SP)"

[dependencies]
ipmsg-protocol = { path = "../protocol" }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_cbor = { workspace = true }
chrono = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
md4 = { workspace = true }
md-5 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
rand = "0.8"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
url = "2"
hex = "0.4"
urlencoding = "2"
bitvec = "1"
serde_json = "1"
dirs = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }

[dev-dependencies]
tempfile = "3"
sha1 = "0.10"
hex = "0.4"
tower = { version = "0.5", features = ["util"] }
