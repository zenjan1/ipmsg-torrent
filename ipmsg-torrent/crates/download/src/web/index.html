<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPMsg-Torrent Downloads</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #00d4ff; margin-bottom: 20px; }
        .status-bar { background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 30px; flex-wrap: wrap; }
        .status-item { display: flex; flex-direction: column; }
        .status-label { font-size: 12px; color: #888; }
        .status-value { font-size: 20px; font-weight: bold; color: #00d4ff; }
        .batch-bar { background: #16213e; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .batch-btn { padding: 6px 14px; border: 1px solid #333; border-radius: 4px; background: #0f3460; color: #eee; cursor: pointer; font-size: 12px; }
        .batch-btn:hover { background: #1a4a80; }
        .batch-btn.danger { border-color: #5c1a1a; color: #ff6b6b; }
        .batch-btn.danger:hover { background: #3a1111; }
        .add-form { background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; }
        .add-form input { flex: 1; padding: 10px; border: 1px solid #333; border-radius: 4px; background: #0f3460; color: #eee; font-size: 14px; }
        .add-form button { padding: 10px 20px; border: none; border-radius: 4px; background: #00d4ff; color: #1a1a2e; font-weight: bold; cursor: pointer; }
        .add-form button:hover { background: #00b8d4; }
        .batch-import { background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .batch-import summary { cursor: pointer; color: #00d4ff; font-weight: bold; margin-bottom: 10px; }
        .batch-import textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #333; border-radius: 4px; background: #0f3460; color: #eee; font-size: 13px; font-family: monospace; resize: vertical; margin-bottom: 10px; }
        .batch-import .batch-import-actions { display: flex; gap: 10px; align-items: center; }
        .batch-import button { padding: 8px 16px; border: none; border-radius: 4px; background: #00d4ff; color: #1a1a2e; font-weight: bold; cursor: pointer; }
        .batch-import button:hover { background: #00b8d4; }
        .batch-import .import-result { font-size: 12px; color: #888; margin-left: 10px; }
        .import-result.success { color: #40c057; }
        .import-result.partial { color: #ffa500; }
        .task-list { display: flex; flex-direction: column; gap: 10px; }
        .task { background: #16213e; padding: 15px; border-radius: 8px; }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .task-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px; }
        .task-state { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .state-downloading { background: #0f3460; color: #00d4ff; }
        .state-paused { background: #533a1b; color: #ffa500; }
        .state-complete { background: #1b4332; color: #40c057; }
        .state-error { background: #5c1a1a; color: #ff6b6b; }
        .state-queued { background: #333; color: #aaa; }
        .progress-bar { height: 8px; background: #0f3460; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00d4ff, #00ff88); transition: width 0.3s; }
        .task-info { display: flex; justify-content: space-between; font-size: 13px; color: #888; }
        .task-actions { display: flex; gap: 8px; }
        .task-actions button { padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-pause { background: #533a1b; color: #ffa500; }
        .btn-resume { background: #1b4332; color: #40c057; }
        .btn-remove { background: #5c1a1a; color: #ff6b6b; }
        .empty { text-align: center; padding: 40px; color: #666; }
        .ws-status { font-size: 11px; color: #666; margin-top: 8px; }
        .ws-connected { color: #40c057; }
        .ws-disconnected { color: #ff6b6b; }
        .proxy-panel { background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .proxy-panel summary { cursor: pointer; color: #00d4ff; font-weight: bold; margin-bottom: 10px; }
        .proxy-status { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .proxy-indicator { width: 10px; height: 10px; border-radius: 50%; }
        .proxy-indicator.on { background: #40c057; }
        .proxy-indicator.off { background: #666; }
        .proxy-info { font-size: 13px; color: #aaa; }
        .proxy-form { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
        .proxy-form input { flex: 1; padding: 8px 10px; border: 1px solid #333; border-radius: 4px; background: #0f3460; color: #eee; font-size: 13px; }
        .proxy-form button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .proxy-btn-set { background: #00d4ff; color: #1a1a2e; font-weight: bold; }
        .proxy-btn-set:hover { background: #00b8d4; }
        .proxy-btn-disable { background: #5c1a1a; color: #ff6b6b; }
        .proxy-btn-disable:hover { background: #3a1111; }
        .proxy-result { font-size: 12px; margin-top: 8px; }
        .proxy-result.success { color: #40c057; }
        .proxy-result.error { color: #ff6b6b; }
        .dep-panel { background: #16213e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .dep-panel summary { cursor: pointer; color: #00d4ff; font-weight: bold; margin-bottom: 10px; }
        .dep-graph { position: relative; overflow-x: auto; padding: 10px 0; }
        .dep-nodes { display: flex; flex-wrap: wrap; gap: 8px; }
        .dep-node { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; font-size: 12px; border: 1px solid #333; }
        .dep-node .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .dep-node .dot.complete { background: #40c057; }
        .dep-node .dot.downloading { background: #00d4ff; }
        .dep-node .dot.paused { background: #ffa500; }
        .dep-node .dot.error { background: #ff6b6b; }
        .dep-node .dot.queued { background: #666; }
        .dep-node .name { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dep-edges { margin-top: 10px; font-size: 12px; color: #888; }
        .dep-edge-item { padding: 3px 0; }
        .dep-edge-item .arrow { color: #00d4ff; margin: 0 4px; }
        .dep-empty { color: #666; font-size: 13px; padding: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📥 IPMsg-Torrent Downloads</h1>
        <div class="status-bar">
            <div class="status-item">
                <span class="status-label">Total</span>
                <span class="status-value" id="total-tasks">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Running</span>
                <span class="status-value" id="running-tasks">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Paused</span>
                <span class="status-value" id="paused-tasks">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Completed</span>
                <span class="status-value" id="completed-tasks">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Speed</span>
                <span class="status-value" id="total-speed">0 B/s</span>
            </div>
            <div class="status-item">
                <span class="status-label">Downloaded</span>
                <span class="status-value" id="total-downloaded">0 B</span>
            </div>
        </div>
        <div class="batch-bar">
            <button class="batch-btn" onclick="batchPauseAll()">⏸ Pause All</button>
            <button class="batch-btn" onclick="batchResumeAll()">▶ Resume All</button>
            <button class="batch-btn danger" onclick="batchRemoveCompleted()">🗑 Clear Completed</button>
            <button class="batch-btn danger" onclick="batchRemoveFailed()">🗑 Clear Failed</button>
        </div>
        <div class="add-form">
            <input type="text" id="url-input" placeholder="Enter URL, magnet link, or torrent path...">
            <button onclick="addDownload()">Add Download</button>
        </div>
        <details class="proxy-panel" id="proxy-panel">
            <summary>🔌 Proxy Configuration</summary>
            <div class="proxy-status">
                <span class="proxy-indicator" id="proxy-indicator"></span>
                <span class="proxy-info" id="proxy-info">Loading...</span>
            </div>
            <div class="proxy-form">
                <input type="text" id="proxy-input" placeholder="socks5://127.0.0.1:1080 or http://user:pass@proxy:8080">
                <button class="proxy-btn-set" onclick="setProxy()">Set Proxy</button>
                <button class="proxy-btn-disable" onclick="disableProxy()">Disable</button>
            </div>
            <div class="proxy-result" id="proxy-result"></div>
        </details>
        <details class="dep-panel" id="dep-panel">
            <summary>🔗 Dependency Graph</summary>
            <div id="dep-content"><div class="dep-empty">Loading...</div></div>
        </details>
        <details class="batch-import">
            <summary>📋 Batch Import (paste multiple URLs)</summary>
            <textarea id="batch-input" placeholder="Paste URLs here, one per line. Supports HTTP, FTP, magnet links, ed2k links.&#10;Lines starting with # are treated as comments.&#10;&#10;Example:&#10;https://example.com/file1.zip&#10;magnet:?xt=urn:btih:abc123...&#10;ed2k://|file|name|size|hash|/"></textarea>
            <div class="batch-import-actions">
                <button onclick="batchImport()">Import All</button>
                <span id="import-result" class="import-result"></span>
            </div>
        </details>
        <div class="task-list" id="task-list">
            <div class="empty">No downloads yet</div>
        </div>
        <div class="ws-status">
            WebSocket: <span id="ws-status" class="ws-disconnected">disconnected</span>
        </div>
    </div>

    <script>
        // --- State ---
        let tasks = {};  // id -> task object
        let ws = null;
        let wsReconnectTimer = null;

        // --- Formatting helpers ---
        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function formatSpeed(bps) {
            return formatSize(bps) + '/s';
        }

        function stateClass(state) {
            return 'state-' + state.toLowerCase();
        }

        // --- Rendering ---
        function renderTasks() {
            const list = document.getElementById('task-list');
            const taskArr = Object.values(tasks);

            if (taskArr.length === 0) {
                list.innerHTML = '<div class="empty">No downloads yet</div>';
                updateStatus({ total_tasks: 0, running: 0, paused: 0, completed: 0, total_speed_bps: 0, total_downloaded: 0 });
                return;
            }

            const running = taskArr.filter(t => t.state === 'downloading').length;
            const totalSpeed = taskArr.reduce((sum, t) => sum + (t.speed_bps || 0), 0);
            // Build stats from local state for rendering
            updateStatus({
                total_tasks: taskArr.length,
                running: running,
                paused: taskArr.filter(t => t.state === 'paused').length,
                completed: taskArr.filter(t => t.state === 'complete').length,
                total_speed_bps: totalSpeed,
                total_downloaded: taskArr.reduce((sum, t) => sum + (t.downloaded || 0), 0),
            });

            list.innerHTML = taskArr.map(task => `
                <div class="task">
                    <div class="task-header">
                        <span class="task-name" title="${task.name}">${task.name}</span>
                        <span class="task-state ${stateClass(task.state)}">${task.state}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${task.progress}%"></div>
                    </div>
                    <div class="task-info">
                        <span>${formatSize(task.downloaded)} / ${formatSize(task.size)} (${task.progress.toFixed(1)}%)</span>
                        <span>${formatSpeed(task.speed_bps)}</span>
                        <div class="task-actions">
                            ${task.state === 'downloading' ? `<button class="btn-pause" onclick="pauseTask('${task.id}')">Pause</button>` : ''}
                            ${task.state === 'paused' || task.state === 'error' ? `<button class="btn-resume" onclick="resumeTask('${task.id}')">Resume</button>` : ''}
                            <button class="btn-remove" onclick="removeTask('${task.id}')">Remove</button>
                        </div>
                    </div>
                    ${task.error ? `<div style="color: #ff6b6b; font-size: 12px; margin-top: 5px;">${task.error}</div>` : ''}
                </div>
            `).join('');
        }

        function updateStatus(stats) {
            document.getElementById('total-tasks').textContent = stats.total_tasks;
            document.getElementById('running-tasks').textContent = stats.running;
            document.getElementById('paused-tasks').textContent = stats.paused;
            document.getElementById('completed-tasks').textContent = stats.completed;
            document.getElementById('total-speed').textContent = formatSpeed(stats.total_speed_bps);
            document.getElementById('total-downloaded').textContent = formatSize(stats.total_downloaded);
        }

        // --- WebSocket ---
        function connectWebSocket() {
            if (ws && ws.readyState === WebSocket.OPEN) return;

            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/api/ws`);

            ws.onopen = () => {
                document.getElementById('ws-status').textContent = 'connected';
                document.getElementById('ws-status').className = 'ws-connected';
                if (wsReconnectTimer) {
                    clearTimeout(wsReconnectTimer);
                    wsReconnectTimer = null;
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleWsMessage(data);
                } catch (e) {
                    console.warn('Failed to parse WS message:', e);
                }
            };

            ws.onclose = () => {
                document.getElementById('ws-status').textContent = 'disconnected';
                document.getElementById('ws-status').className = 'ws-disconnected';
                // Auto-reconnect after 3 seconds
                wsReconnectTimer = setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        function handleWsMessage(data) {
            // Initial snapshot: array of tasks
            if (Array.isArray(data)) {
                tasks = {};
                data.forEach(t => { tasks[t.id] = t; });
                renderTasks();
                return;
            }

            // Event messages
            switch (data.type) {
                case 'task_added':
                    if (data.task) {
                        tasks[data.task.id] = data.task;
                        renderTasks();
                    }
                    break;
                case 'task_updated':
                    if (data.task) {
                        tasks[data.task.id] = data.task;
                        renderTasks();
                    }
                    break;
                case 'task_removed':
                    if (data.task_id) {
                        delete tasks[data.task_id];
                        renderTasks();
                    }
                    break;
                case 'status':
                    updateStatus(data);
                    break;
            }
        }

        // --- API actions ---
        async function addDownload() {
            const input = document.getElementById('url-input');
            const url = input.value.trim();
            if (!url) return;

            await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });

            input.value = '';
            // WebSocket will deliver the task_added event
        }

        async function pauseTask(id) {
            await fetch(`/api/tasks/${id}/pause`, { method: 'POST' });
        }

        async function resumeTask(id) {
            await fetch(`/api/tasks/${id}/resume`, { method: 'POST' });
        }

        async function removeTask(id) {
            if (!confirm('Remove this task?')) return;
            await fetch(`/api/tasks/${id}/remove`, { method: 'POST' });
        }

        // --- Batch import ---
        async function batchImport() {
            const textarea = document.getElementById('batch-input');
            const resultSpan = document.getElementById('import-result');
            const text = textarea.value.trim();
            if (!text) return;

            const urls = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (urls.length === 0) return;

            resultSpan.textContent = 'Importing...';
            resultSpan.className = 'import-result';

            try {
                const resp = await fetch('/api/batch-import', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls })
                });
                const data = await resp.json();

                if (data.failed === 0) {
                    resultSpan.textContent = `✓ Imported ${data.added} URLs`;
                    resultSpan.className = 'import-result success';
                } else {
                    resultSpan.textContent = `⚠ ${data.added} added, ${data.skipped} skipped, ${data.failed} failed`;
                    resultSpan.className = 'import-result partial';
                }

                textarea.value = '';
            } catch (e) {
                resultSpan.textContent = '✗ Import failed: ' + e.message;
                resultSpan.className = 'import-result partial';
            }
        }

        // --- Proxy ---
        async function loadProxyStatus() {
            try {
                const resp = await fetch('/api/proxy');
                const data = await resp.json();
                const indicator = document.getElementById('proxy-indicator');
                const info = document.getElementById('proxy-info');
                if (data.enabled) {
                    indicator.className = 'proxy-indicator on';
                    info.textContent = `${data.proxy_type} ${data.host}:${data.port}${data.has_auth ? ' (authenticated)' : ''}`;
                } else {
                    indicator.className = 'proxy-indicator off';
                    info.textContent = 'Proxy disabled';
                }
            } catch (e) {
                document.getElementById('proxy-info').textContent = 'Failed to load proxy status';
            }
        }

        async function setProxy() {
            const input = document.getElementById('proxy-input');
            const result = document.getElementById('proxy-result');
            const url = input.value.trim();
            if (!url) {
                result.textContent = 'Please enter a proxy URL';
                result.className = 'proxy-result error';
                return;
            }
            try {
                const resp = await fetch('/api/proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await resp.json();
                if (data.success) {
                    result.textContent = '✓ ' + data.message;
                    result.className = 'proxy-result success';
                    input.value = '';
                    loadProxyStatus();
                } else {
                    result.textContent = '✗ ' + data.message;
                    result.className = 'proxy-result error';
                }
            } catch (e) {
                result.textContent = '✗ Failed: ' + e.message;
                result.className = 'proxy-result error';
            }
        }

        async function disableProxy() {
            const result = document.getElementById('proxy-result');
            try {
                const resp = await fetch('/api/proxy/disable', { method: 'POST' });
                const data = await resp.json();
                if (data.success) {
                    result.textContent = '✓ ' + data.message;
                    result.className = 'proxy-result success';
                    loadProxyStatus();
                } else {
                    result.textContent = '✗ ' + data.message;
                    result.className = 'proxy-result error';
                }
            } catch (e) {
                result.textContent = '✗ Failed: ' + e.message;
                result.className = 'proxy-result error';
            }
        }

        // --- Dependency Graph ---
        async function loadDeps() {
            try {
                const resp = await fetch('/api/deps');
                const data = await resp.json();
                renderDepsGraph(data);
            } catch (e) {
                document.getElementById('dep-content').innerHTML = '<div class="dep-empty">Failed to load</div>';
            }
        }

        function renderDepsGraph(data) {
            const container = document.getElementById('dep-content');
            if (!data.nodes || data.nodes.length === 0) {
                container.innerHTML = '<div class="dep-empty">No tasks with dependencies</div>';
                return;
            }
            // Only show nodes that have dependencies or are depended upon
            const depNodeIds = new Set();
            data.nodes.forEach(n => {
                if (n.depends_on && n.depends_on.length > 0) {
                    depNodeIds.add(n.id);
                    n.depends_on.forEach(d => depNodeIds.add(d));
                }
            });
            if (depNodeIds.size === 0) {
                container.innerHTML = '<div class="dep-empty">No tasks with dependencies</div>';
                return;
            }
            const nodeMap = {};
            data.nodes.forEach(n => { nodeMap[n.id] = n; });
            let html = '<div class="dep-nodes">';
            data.nodes.filter(n => depNodeIds.has(n.id)).forEach(n => {
                const stateCls = n.state.toLowerCase();
                const title = n.depends_on.length > 0
                    ? 'Depends on: ' + n.depends_on.map(d => (nodeMap[d] || {}).name || d).join(', ')
                    : 'No dependencies';
                html += `<div class="dep-node" title="${title}"><span class="dot ${stateCls}"></span><span class="name">${n.name}</span></div>`;
            });
            html += '</div>';
            if (data.edges && data.edges.length > 0) {
                html += '<div class="dep-edges">';
                data.edges.forEach(e => {
                    const fromName = (nodeMap[e.from] || {}).name || e.from;
                    const toName = (nodeMap[e.to] || {}).name || e.to;
                    html += `<div class="dep-edge-item">${fromName} <span class="arrow">→</span> ${toName}</div>`;
                });
                html += '</div>';
            }
            container.innerHTML = html;
        }

        // --- Init ---
        // Try WebSocket first, fall back to polling
        if ('WebSocket' in window) {
            connectWebSocket();
        } else {
            // Fallback: polling every 2 seconds
            async function pollRender() {
                const resp = await fetch('/api/tasks');
                const taskArr = await resp.json();
                tasks = {};
                taskArr.forEach(t => { tasks[t.id] = t; });
                const statsResp = await fetch('/api/stats');
                const stats = await statsResp.json();
                updateStatus(stats);
                renderTasks();
            }
            pollRender();
            setInterval(pollRender, 2000);
        }

        // Enter key to add download
        document.getElementById('url-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addDownload();
        });

        // Enter key to set proxy
        document.getElementById('proxy-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') setProxy();
        });

        // Load proxy status on init
        loadProxyStatus();

        // Load dependency graph on init and refresh periodically
        loadDeps();
        setInterval(loadDeps, 5000);

        // --- Batch operations ---
        async function batchPauseAll() {
            await fetch('/api/batch/pause-all', { method: 'POST' });
        }
        async function batchResumeAll() {
            await fetch('/api/batch/resume-all', { method: 'POST' });
        }
        async function batchRemoveCompleted() {
            if (!confirm('Remove all completed downloads?')) return;
            await fetch('/api/batch/remove-completed', { method: 'POST' });
        }
        async function batchRemoveFailed() {
            if (!confirm('Remove all failed downloads?')) return;
            await fetch('/api/batch/remove-failed', { method: 'POST' });
        }
    </script>
</body>
</html>
